<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Галькино — живая деревня</title>
<style>
:root{--ink:#56351d}*{box-sizing:border-box}body{margin:0;background:#e8d4a9;color:var(--ink);font-family:Georgia,serif;text-align:center}
header{padding:20px 12px 4px}h1{margin:0;font-size:clamp(30px,5vw,48px)}p{margin:9px 0}
.scene{position:relative;width:min(98vw,1536px);margin:16px auto 12px;border:6px solid #b78a51;border-radius:26px;overflow:hidden;box-shadow:0 8px 30px #64401b45;cursor:none;background:#b7d5bf;touch-action:manipulation}
.map{display:block;width:100%;height:auto}
#eye{position:absolute;left:0;top:0;pointer-events:none;transform:translate(-50%,-50%);width:45px;height:45px;display:none;filter:drop-shadow(1px 2px 2px #4b311b80);z-index:5}
.scene:hover #eye{display:block}
/* Координаты жителей: меняй left, top и width */
#timofey{left:23.7%;top:42.0%;width:3.44%}
#marfa{left:62.8%;top:33.7%;width:3.44%}
/* Прохор у мельницы: здесь можно изменить положение */
#prokhor{left:16%;top:18%;width:3.44%}
.resident{position:absolute;transform:translate(-50%,-50%);aspect-ratio:160/180;cursor:none;user-select:none;-webkit-tap-highlight-color:transparent;z-index:2}
.resident img{position:absolute;width:100%;height:100%;object-fit:contain;left:0;top:0;pointer-events:none;transition:opacity .12s}
 .resident .stone,.resident .stone-eyes{opacity:0}
.resident .stone-eyes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity .12s}
.resident.peeking .stone-eyes{opacity:1}
.resident .pupils{transition:transform .22s ease}
.resident.look-left .pupils{transform:translateX(-4px)}
.resident.look-right .pupils{transform:translateX(4px)}
.resident.changed .alive{opacity:0}
.resident.changed .stone{opacity:1}
/* Навес виден только во время каменного состояния Марфы и ещё 150 мс после него. */
#marfa-front{position:absolute;left:0;top:0;width:100%;height:100%;z-index:3;pointer-events:none;display:none}
.scene.marfa-front-visible #marfa-front{display:block}
.note{font-size:15px;padding:0 12px 24px}
@media(hover:none){.scene{cursor:default}#eye{display:none!important}}
</style></head><body>
<header><h1>Деревня Галькино</h1><p>Познакомься с Тимофеем, Марфой и Прохором!</p></header>
<div class="scene" id="scene" aria-label="Карта деревни Галькино">
<img src="village.png" class="map" alt="Карта деревни Галькино">
<div id="timofey" class="resident" role="button" tabindex="0" aria-label="Тимофей Булыжников, почтальон">
<img class="alive" src="timofey_alive.png" alt=""><img class="stone" src="timofey_closed.png" alt="">
<!-- Глаза — отдельный прозрачный слой поверх одного камня -->
<svg class="stone-eyes" viewBox="0 0 160 180" aria-hidden="true"><g fill="#f9f0dc" stroke="#514d48" stroke-width="2.5"><ellipse cx="59" cy="100" rx="11" ry="9"/><ellipse cx="101" cy="100" rx="11" ry="9"/></g><g class="pupils"><circle cx="59" cy="100" r="5" fill="#252525"/><circle cx="101" cy="100" r="5" fill="#252525"/><circle cx="57" cy="98" r="1.5" fill="white"/><circle cx="99" cy="98" r="1.5" fill="white"/></g></svg></div>
<div id="marfa" class="resident" role="button" tabindex="0" aria-label="Марфа Крошкина, пекарь">
<img class="alive" src="marfa_alive.png" alt=""><img class="stone" src="marfa_closed.png" alt="">
<svg class="stone-eyes" viewBox="0 0 160 180" aria-hidden="true"><g fill="#f9f0dc" stroke="#514d48" stroke-width="2.5"><ellipse cx="59" cy="100" rx="11" ry="9"/><ellipse cx="101" cy="100" rx="11" ry="9"/></g><g class="pupils"><circle cx="59" cy="100" r="5" fill="#252525"/><circle cx="101" cy="100" r="5" fill="#252525"/><circle cx="57" cy="98" r="1.5" fill="white"/><circle cx="99" cy="98" r="1.5" fill="white"/></g></svg></div>
<div id="prokhor" class="resident" role="button" tabindex="0" aria-label="Прохор Мельников, мельник">
<img class="alive" src="prokhor_alive.png" alt=""><img class="stone" src="prokhor_closed.png" alt="">
<svg class="stone-eyes" viewBox="0 0 160 180" aria-hidden="true">
<g fill="#f9f0dc" stroke="#514d48" stroke-width="2.5"><ellipse cx="59" cy="100" rx="11" ry="9"/><ellipse cx="101" cy="100" rx="11" ry="9"/></g>
<g class="pupils"><circle cx="59" cy="100" r="5" fill="#252525"/><circle cx="101" cy="100" r="5" fill="#252525"/><circle cx="57" cy="98" r="1.5" fill="white"/><circle cx="99" cy="98" r="1.5" fill="white"/></g></svg>
</div>
<img src="marfa_front.png" id="marfa-front" alt="" aria-hidden="true">
<svg id="eye" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M3 24Q24 1 45 24Q24 47 3 24Z" fill="#f8e5bb" stroke="#57351d" stroke-width="3"/><circle cx="24" cy="24" r="10" fill="#77a9a7" stroke="#57351d" stroke-width="2"/><circle cx="24" cy="24" r="5" fill="#2c302d"/><circle cx="21" cy="21" r="2.5" fill="white"/></svg>
</div>
<p class="note">Наведи глаз на жителя: он станет камнем. Уведи курсор: через секунду камень посмотрит влево, вправо, прямо и снова оживёт.</p>
<script>
const scene=document.getElementById('scene'),eye=document.getElementById('eye');
function setupResident(person){
  let timers=[],watching=false;
  const clear=()=>{timers.forEach(clearTimeout);timers=[]};
  const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
  function hide(){watching=true;clear();person.className='resident changed';if(person.id==='marfa')scene.classList.add('marfa-front-visible')}
  function restore(){watching=false;clear();if(!person.classList.contains('changed'))return;
    later(()=>{if(!watching)person.classList.add('peeking','look-left')},1000);
    later(()=>{if(!watching){person.classList.remove('look-left');person.classList.add('look-right')}},1600);
    later(()=>{if(!watching)person.classList.remove('look-right')},2350);
    later(()=>{if(!watching)person.className='resident'},2850);
    // Навес исчезает после того, как переход к обычной Марфе завершился (2850 + 120 мс).
    if(person.id==='marfa')later(()=>{if(!watching)scene.classList.remove('marfa-front-visible')},3000);
  }
  person.addEventListener('pointerenter',hide);
  person.addEventListener('pointerleave',restore);
  person.addEventListener('click',()=>{hide();restore()});
  person.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hide();restore()}});
  scene.addEventListener('pointerleave',restore);
}
document.querySelectorAll('.resident').forEach(setupResident);
scene.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){const r=scene.getBoundingClientRect();eye.style.left=(e.clientX-r.left)+'px';eye.style.top=(e.clientY-r.top)+'px'}});
</script></body></html>
